<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Bank Customer Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<header>

    <h2>🏦 Secure Bank</h2>

    <div class="profile">
        <i class="fa-solid fa-user-circle"></i>
        <span>Welcome, Harshit</span>
    </div>

</header>

<div class="container">

    <div class="customer-card">

        <h2>Customer Information</h2>

        <p><strong>Name :</strong> Harshit Namdev</p>
        <p><strong>Account No :</strong> 1234567890</p>
        <p><strong>Branch :</strong> Bhopal</p>
        <p><strong>Account Type :</strong> Savings</p>

    </div>

    <div class="summary">

        <div class="card">
            <h3>Available Balance</h3>
            <h1>₹ <span id="balance">25000</span></h1>
        </div>

        <div class="card">
            <h3>Total Deposits</h3>
            <h1 id="depositTotal">₹ 0</h1>
        </div>

        <div class="card">
            <h3>Total Withdrawals</h3>
            <h1 id="withdrawTotal">₹ 0</h1>
        </div>

    </div>

    <div class="transaction">

        <h2>Bank Transaction</h2>

        <input
            type="number"
            id="amount"
            placeholder="Enter Amount">

        <div class="buttons">

            <button class="deposit"
                onclick="depositMoney()">
                Deposit
            </button>

            <button class="withdraw"
                onclick="withdrawMoney()">
                Withdraw
            </button>

        </div>

    </div>

    <div class="history">

        <h2>Recent Transactions</h2>

        <table>

            <thead>

            <tr>
                <th>Transaction</th>
                <th>Amount</th>
            </tr>

            </thead>

            <tbody id="history">

            </tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
